[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "strokecopilot"
version = "1.0.2"
description = "Stroke Decision Copilot: vision models for stroke CT (haemorrhage; core and penumbra), a language-model reasoner given a guideline rulebook written in our own words, and a claim-level verifier that measures hallucination (MAAI 901/902, UOWD)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "jsonschema>=4.18",
    "numpy",  # the offline replay (pipeline.replay) needs it, so the README's quick start works on a plain install
]

[project.optional-dependencies]
# Everything `pytest` needs to collect and run the suite without data; tests of the heavier parts (torch, timm,
# opencv, the LLM clients) skip themselves when those are not installed.
dev = ["pytest>=7", "numpy", "scipy", "pandas", "matplotlib", "pydicom>=2.3", "nibabel", "fastapi>=0.115", "httpx"]
rsna = ["numpy", "pandas", "pydicom>=2.3", "opencv-python-headless"]
isles = ["numpy", "pandas", "openpyxl", "nibabel", "scipy", "matplotlib"]
corpus = ["pypdf"]  # only for the local copy check
retrieval = ["numpy", "sentence-transformers"]
llm = ["anthropic>=2.4", "openai>=1.40"]  # openai: the client for vLLM's OpenAI-compatible server (VLLMJSON)
# The public Hugging Face Space (DEC-32): server, live runs and the verifier's retrieval.
space = ["fastapi>=0.115", "uvicorn>=0.30", "anthropic>=2.4", "numpy", "pandas", "scipy", "nibabel", "sentence-transformers"]
# Item 4 (DEC-30): LoRA fine-tuning of the small reasoner on a Colab A100 (notebook 54); versions as tested on CPU.
finetune = ["torch", "transformers==5.22.1", "peft==0.21.3", "accelerate==1.16.0", "safetensors"]
# Phase 5 report-only analyses (DEC-35, DEC-36): SHAP, surrogates and t-tests; shap pinned as installed and tested.
analysis = ["numpy", "scipy", "matplotlib", "scikit-learn", "shap==0.48.0", "rank-bm25==0.2.2", "onnx>=1.23", "onnxruntime>=1.32", "onnxscript", "open_clip_torch==3.2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/strokecopilot"]

# Ship the contract schemas, fixtures, split, prompts and corpus inside the wheel so `pip install git+...` on Colab
# can validate without a repo checkout. The repo-root copies stay the single source of truth.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "strokecopilot/schemas"
"fixtures" = "strokecopilot/fixtures"
"splits" = "strokecopilot/splits"
"prompts" = "strokecopilot/prompts"
"corpus" = "strokecopilot/corpus"

[tool.pytest.ini_options]
testpaths = ["tests"]
